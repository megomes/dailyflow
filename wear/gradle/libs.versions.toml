# Versions known stable at writing time; Android Studio's upgrade assistant can bump them.
[versions]
agp = "8.12.0"
kotlin = "2.2.10"
composeBom = "2025.09.01"
activityCompose = "1.11.0"
wearCompose = "1.5.2"
tiles = "1.5.0"
protolayout = "1.3.0"
complications = "1.2.1"
concurrentFutures = "1.3.0"
coroutines = "1.10.2"
coreSplash = "1.0.1"
watchface = "1.2.1"
firebaseBom = "34.19.0"
googleServices = "4.5.0"

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
wear-compose-material = { group = "androidx.wear.compose", name = "compose-material", version.ref = "wearCompose" }
wear-compose-foundation = { group = "androidx.wear.compose", name = "compose-foundation", version.ref = "wearCompose" }
wear-tiles = { group = "androidx.wear.tiles", name = "tiles", version.ref = "tiles" }
wear-protolayout = { group = "androidx.wear.protolayout", name = "protolayout", version.ref = "protolayout" }
wear-protolayout-material = { group = "androidx.wear.protolayout", name = "protolayout-material", version.ref = "protolayout" }
wear-complications = { group = "androidx.wear.watchface", name = "watchface-complications-data-source-ktx", version.ref = "complications" }
concurrent-futures = { group = "androidx.concurrent", name = "concurrent-futures-ktx", version.ref = "concurrentFutures" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-guava = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-guava", version.ref = "coroutines" }

wear-watchface = { group = "androidx.wear.watchface", name = "watchface", version.ref = "watchface" }
wear-watchface-data = { group = "androidx.wear.watchface", name = "watchface-complications-data", version.ref = "watchface" }
wear-watchface-style = { group = "androidx.wear.watchface", name = "watchface-style", version.ref = "watchface" }
wear-watchface-editor = { group = "androidx.wear.watchface", name = "watchface-editor", version.ref = "watchface" }

wear-protolayout-expression = { group = "androidx.wear.protolayout", name = "protolayout-expression", version.ref = "protolayout" }

firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging" }

profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version = "1.4.1" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
