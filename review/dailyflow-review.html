  }
}

/* ── Base ── */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg-app);color:var(--text-primary);font:400 14px/1.5 var(--font-sans);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
button,input,textarea,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:var(--radius-sm)}
.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.i.sm{width:14px;height:14px}
.mono{font-family:var(--font-mono);font-size:12px;letter-spacing:-.01em}
.muted{color:var(--text-muted)}
.sec{color:var(--text-secondary)}
[hidden]{display:none!important}

/* ── Layout ── */
.app{display:grid;grid-template-columns:var(--sidebar-width) minmax(0,1fr);min-height:100%;position:relative;z-index:0;background:var(--bg-app)}
.sidebar{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;background:var(--bg-sidebar);border-right:1px solid var(--border-default);padding:18px 14px 14px;min-width:0}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px;font-weight:650;font-size:16px;letter-spacing:-.01em}
.brand img{width:26px;height:26px;border-radius:7px}
.brand small{margin-left:auto;font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em}
.search{display:flex;align-items:center;gap:8px;height:38px;padding:0 10px;background:var(--bg-input);border:1px solid var(--border-input);border-radius:var(--radius-md);color:var(--text-muted);transition:var(--tr)}
.search:focus-within{border-color:var(--border-strong)}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:0;color:var(--text-primary);height:100%}
.search input::placeholder{color:var(--text-placeholder)}
kbd{font:500 11px var(--font-sans);color:var(--text-muted);border:1px solid var(--border-default);border-radius:4px;padding:1px 5px;background:var(--bg-surface)}
.nav{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:20px;margin:0 -4px;padding:0 4px}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);padding:0 10px 6px}
.nav-item{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:6px;color:var(--text-secondary);text-decoration:none;font-weight:500;font-size:14px;border:0;background:transparent;cursor:pointer;width:100%;text-align:left;transition:var(--tr)}
.nav-item .i{color:var(--text-muted)}
.nav-item:hover{background:var(--bg-surface-hover);color:var(--text-primary)}
.nav-item[aria-current="page"]{background:var(--bg-surface-active);color:var(--text-primary)}
.nav-item[aria-current="page"] .i{color:var(--text-primary)}
.nav-item .badge{margin-left:auto}
.badge{font:500 11px var(--font-sans);font-variant-numeric:tabular-nums;color:var(--text-muted);border:1px solid var(--border-default);border-radius:5px;padding:0 6px;height:20px;display:inline-flex;align-items:center;background:var(--bg-surface)}
.badge.done{color:var(--pill-green-fg);border-color:var(--pill-green-bd);background:var(--pill-green-bg)}
.side-foot{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--border-subtle);padding-top:12px}
.progress-line{display:flex;justify-content:space-between;font-size:12px;color:var(--text-muted);font-variant-numeric:tabular-nums}
.bar{height:4px;border-radius:3px;background:var(--border-subtle);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--text-secondary);border-radius:3px;transition:width 300ms ease}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted)}
.sync .dot{width:6px;height:6px;border-radius:50%;background:var(--text-disabled)}
.sync[data-s="cloud"] .dot{background:var(--accent-green)}
.sync[data-s="local"] .dot{background:var(--accent-yellow)}
.sync[data-s="error"] .dot{background:var(--accent-pink)}
.foot-row{display:flex;gap:8px}
.foot-row .btn{flex:1}

.main{min-width:0}
.scrim{display:none}
.mhead{display:none}
.page{padding:var(--page-padding-y) var(--page-padding-x) 80px;max-width:1240px}

/* ── Controls ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:var(--radius-md);background:var(--bg-button);border:1px solid var(--border-input);color:var(--text-primary);font-weight:500;font-size:13.5px;cursor:pointer;transition:var(--tr);white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--bg-surface-hover);border-color:var(--border-strong)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;gap:6px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text-secondary)}
.btn.ghost:hover{background:var(--bg-surface-hover);color:var(--text-primary)}
.btn.icon{width:36px;padding:0}
.btn.danger[data-armed="1"]{color:var(--pill-pink-fg);border-color:var(--pill-pink-bd);background:var(--pill-pink-bg)}
.seg{display:inline-flex;gap:2px;padding:2px;background:var(--bg-segmented);border:1px solid var(--border-default);border-radius:var(--radius-md);max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border:0;border-radius:5px;background:transparent;color:var(--text-muted);font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap;transition:var(--tr)}
.seg button:hover{color:var(--text-primary)}
.seg button[aria-pressed="true"]{background:var(--bg-surface-active);color:var(--text-primary)}
.seg button .n{font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:20px 0 8px}
.toolbar .grow{flex:1}

/* ── Page header ── */
.crumbs{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-muted);margin-bottom:14px}
.crumbs b{color:var(--text-primary);font-weight:500;background:var(--bg-surface);border:1px solid var(--border-subtle);padding:2px 8px;border-radius:6px}
h1{font-size:26px;font-weight:680;letter-spacing:-.02em;line-height:1.15;margin:0;text-wrap:balance}
.lead{color:var(--text-secondary);max-width:72ch;margin:8px 0 0;font-size:14.5px}
h2{font-size:17px;font-weight:620;letter-spacing:-.01em;margin:0;text-wrap:balance}
h3{font-size:14px;font-weight:600;margin:0}
.section{margin-top:32px;display:flex;flex-direction:column;gap:12px}
.section-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.section-head .muted{font-size:13px}

/* ── Tags ── */
.tag{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:5px;font-size:11.5px;font-weight:500;border:1px solid var(--pill-gray-bd);background:var(--pill-gray-bg);color:var(--pill-gray-fg);white-space:nowrap}
.tag.blue{background:var(--pill-blue-bg);color:var(--pill-blue-fg);border-color:var(--pill-blue-bd)}
.tag.purple{background:var(--pill-purple-bg);color:var(--pill-purple-fg);border-color:var(--pill-purple-bd)}
.tag.pink{background:var(--pill-pink-bg);color:var(--pill-pink-fg);border-color:var(--pill-pink-bd)}
.tag.green{background:var(--pill-green-bg);color:var(--pill-green-fg);border-color:var(--pill-green-bd)}
.tag.orange{background:var(--pill-orange-bg);color:var(--pill-orange-fg);border-color:var(--pill-orange-bd)}
.tag.yellow{background:var(--pill-yellow-bg);color:var(--pill-yellow-fg);border-color:var(--pill-yellow-bd)}
.tag.cyan{background:var(--pill-cyan-bg);color:var(--pill-cyan-fg);border-color:var(--pill-cyan-bd)}
.tag.link{cursor:pointer;font-family:var(--font-mono);font-size:11px}
.tag.link:hover{border-color:var(--border-strong);color:var(--text-primary)}

/* ── Review controls ── */
.rv{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.st-seg button{height:26px;padding:0 8px;font-size:12px;gap:5px}
.st-seg button .i{width:14px;height:14px}
.st-seg button[aria-pressed="true"].st-ok{background:var(--pill-green-bg);color:var(--pill-green-fg)}
.st-seg button[aria-pressed="true"].st-adj{background:var(--pill-yellow-bg);color:var(--pill-yellow-fg)}
.st-seg button[aria-pressed="true"].st-rem{background:var(--pill-pink-bg);color:var(--pill-pink-fg)}
.st-seg button[aria-pressed="true"].st-q{background:var(--pill-purple-bg);color:var(--pill-purple-fg)}
.compact .st-seg button span{display:none}
.cbtn{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 8px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--text-muted);font-size:12px;font-weight:500;cursor:pointer;transition:var(--tr)}
.cbtn .i{width:14px;height:14px}
.cbtn:hover{background:var(--bg-surface-hover);color:var(--text-primary)}
.cbtn.has{color:var(--pill-blue-fg);background:var(--pill-blue-bg);border-color:var(--pill-blue-bd)}
.cwrap{margin-top:8px}
.cm{display:block;width:100%;min-height:38px;resize:vertical;background:var(--bg-input);border:1px solid var(--border-input);border-radius:var(--radius-md);padding:8px 11px;color:var(--text-primary);font-size:13.5px;line-height:1.5;outline:0;transition:var(--tr);overflow:hidden}
.cm::placeholder{color:var(--text-placeholder)}
.cm:focus{border-color:var(--focus)}
.cm.filled{border-color:var(--border-strong)}
.sdot{width:8px;height:8px;border-radius:50%;flex:none;background:transparent;border:1px solid var(--border-strong)}
.sdot[data-s="ok"]{background:var(--accent-green);border-color:transparent}
.sdot[data-s="adj"]{background:var(--accent-yellow);border-color:transparent}
.sdot[data-s="rem"]{background:var(--accent-pink);border-color:transparent}
.sdot[data-s="q"]{background:var(--accent-purple);border-color:transparent}
.sdot[data-c="1"]{box-shadow:0 0 0 2px var(--bg-app),0 0 0 3px var(--accent-blue)}

/* ── Lists (stories, capabilities) ── */
.list{border:1px solid var(--border-default);border-radius:var(--radius-lg);background:var(--bg-surface);overflow:hidden}
.row{display:grid;grid-template-columns:132px minmax(0,1fr) auto;gap:6px 16px;align-items:start;padding:11px 14px;border-top:1px solid var(--border-subtle)}
.row:first-child{border-top:0}
.row>.mono{color:var(--text-muted);padding-top:2px}
.row .txt{display:flex;flex-direction:column;gap:4px;min-width:0}
.row .txt .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--text-muted)}
.row .cwrap{grid-column:2 / -1;margin-top:2px}
.row.flash,.card.flash,.flow.flash,.q.flash,.touch.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{background:var(--pill-blue-bg)}100%{background:transparent}}
.cap-row{grid-template-columns:minmax(0,1fr) auto}
.cap-row .cwrap{grid-column:1 / -1}

/* ── Cards ── */
.card{background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--radius-lg);padding:16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
.card p{margin:0}
.kv{display:grid;grid-template-columns:92px minmax(0,1fr);gap:6px 12px;font-size:13px;margin:10px 0 12px}
.kv dt{color:var(--text-muted)}
.kv dd{margin:0;display:flex;flex-wrap:wrap;gap:5px}
.card .rv{margin-top:6px}

/* ── Overview ── */
.howto{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--border-default);border-radius:var(--radius-lg);background:var(--bg-surface);margin-top:24px}
.howto>div{padding:14px 16px;border-left:1px solid var(--border-subtle);display:flex;flex-direction:column;gap:4px}
.howto>div:first-child{border-left:0}
.howto b{font-weight:600;font-size:13.5px;display:flex;gap:8px;align-items:center}
.howto span{font-size:13px;color:var(--text-secondary)}
.howto .num{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);border:1px solid var(--border-default);border-radius:4px;padding:0 5px}
.prog{display:grid;grid-template-columns:minmax(160px,220px) minmax(0,1fr) 70px;gap:14px;align-items:center;padding:9px 14px;border-top:1px solid var(--border-subtle);cursor:pointer;transition:var(--tr)}
.prog:first-child{border-top:0}
.prog:hover{background:var(--bg-surface-hover)}
.prog .n{font-variant-numeric:tabular-nums;text-align:right;font-size:12.5px;color:var(--text-muted)}
.thesis{border-left:2px solid var(--border-strong);padding:4px 0 4px 16px;font-size:18px;font-weight:560;letter-spacing:-.01em;max-width:60ch;text-wrap:balance}
.questions6{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0;padding:0;list-style:none;counter-reset:q}
.questions6 li{counter-increment:q;font-size:13.5px;color:var(--text-secondary);padding:10px 12px;border:1px solid var(--border-subtle);border-radius:var(--radius-md);background:var(--bg-surface);display:flex;gap:10px}
.questions6 li::before{content:counter(q);font-family:var(--font-mono);font-size:11px;color:var(--text-muted);padding-top:2px}
.cycle{display:grid;grid-template-columns:5fr 3fr 3fr;gap:10px}
.lane{border:1px solid var(--border-default);border-radius:var(--radius-lg);background:var(--bg-surface);padding:12px;display:flex;flex-direction:column;gap:10px}
.lane-h{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}
.steps{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.steps .arrow{color:var(--text-disabled)}
.stepchip{height:28px;display:inline-flex;align-items:center;padding:0 10px;border-radius:6px;background:var(--bg-surface-hover);border:1px solid var(--border-subtle);font-size:13px;font-weight:500}
.learn{margin-top:10px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text-secondary)}
.layers{display:grid;grid-template-columns:44px repeat(3,minmax(0,1fr));gap:10px}
.lcol h3{font-size:12.5px;margin-bottom:6px;display:flex;gap:6px;align-items:center}
.lcol p{font-size:12px;color:var(--text-muted);margin:0 0 8px;min-height:36px}
.tl{position:relative;border:1px solid var(--grid-line);border-radius:8px;background:var(--bg-app);overflow:hidden}
.tl .hr{position:absolute;left:0;right:0;border-top:1px solid var(--grid-line)}
.tl .hr span{position:absolute;left:4px;top:1px;font-size:10px;color:var(--text-disabled);font-variant-numeric:tabular-nums}
.axis{position:relative}
.axis span{position:absolute;right:4px;font-size:10.5px;color:var(--text-muted);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.blk{position:absolute;left:4px;right:4px;border-radius:5px;padding:2px 7px;font-size:11.5px;font-weight:500;border:1px solid;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;line-height:1.35;display:flex;justify-content:space-between;gap:6px}
.blk small{font-weight:400;opacity:.8;font-variant-numeric:tabular-nums}
.blk.ghost{background:transparent!important;border-style:dashed}
.c-blue{background:var(--pill-blue-bg);color:var(--pill-blue-fg);border-color:var(--pill-blue-bd)}
.c-purple{background:var(--pill-purple-bg);color:var(--pill-purple-fg);border-color:var(--pill-purple-bd)}
.c-pink{background:var(--pill-pink-bg);color:var(--pill-pink-fg);border-color:var(--pill-pink-bd)}
.c-green{background:var(--pill-green-bg);color:var(--pill-green-fg);border-color:var(--pill-green-bd)}
.c-orange{background:var(--pill-orange-bg);color:var(--pill-orange-fg);border-color:var(--pill-orange-bd)}
.c-yellow{background:var(--pill-yellow-bg);color:var(--pill-yellow-fg);border-color:var(--pill-yellow-bd)}
.c-cyan{background:var(--pill-cyan-bg);color:var(--pill-cyan-fg);border-color:var(--pill-cyan-bd)}
.c-gray{background:var(--pill-gray-bg);color:var(--pill-gray-fg);border-color:var(--pill-gray-bd)}
.nowline{position:absolute;left:0;right:0;height:0;border-top:1.5px solid var(--accent-pink);z-index:2}
.nowline::before{content:"";position:absolute;left:-1px;top:-4.5px;width:7px;height:7px;border-radius:50%;background:var(--accent-pink)}
.nowline span{position:absolute;right:4px;top:-9px;font-size:10px;font-weight:600;color:var(--accent-pink);background:var(--bg-app);padding:0 4px;border-radius:3px;font-variant-numeric:tabular-nums}

/* ── Day in life ── */
.legend{display:flex;flex-wrap:wrap;gap:6px}
.touches{display:flex;flex-direction:column}
.touch{display:grid;grid-template-columns:64px 22px minmax(0,1fr);gap:0 12px;border-radius:8px}
.touch .time{font:600 13px var(--font-sans);font-variant-numeric:tabular-nums;padding-top:14px;text-align:right;color:var(--text-secondary)}
.touch .rail{position:relative}
.touch .rail::before{content:"";position:absolute;left:10px;top:0;bottom:0;border-left:1px solid var(--border-default)}
.touch .rail i{position:absolute;left:5px;top:17px;width:11px;height:11px;border-radius:50%;border:2px solid var(--bg-app);background:var(--text-disabled)}
.touch:first-child .rail::before{top:18px}
.touch:last-child .rail::before{bottom:calc(100% - 18px)}
.touch .body{padding:10px 0 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.touch .head{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.touch .io{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:12px}
.touch .io div{font-size:13.5px}
.touch .io b{display:block;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);margin-bottom:2px}
.s-nao{--sc:var(--text-muted)} .s-plan{--sc:var(--accent-purple)} .s-ativo{--sc:var(--accent-blue)} .s-fech{--sc:var(--accent-orange)} .s-fechado{--sc:var(--accent-green)}
.touch.s-nao .rail i,.touch.s-plan .rail i,.touch.s-ativo .rail i,.touch.s-fech .rail i,.touch.s-fechado .rail i{background:var(--sc)}

/* ── Flows ── */
.flows{display:flex;flex-direction:column;gap:10px}
.flow{border:1px solid var(--border-default);border-radius:var(--radius-lg);background:var(--bg-surface)}
.flow>summary{list-style:none;display:grid;grid-template-columns:auto 50px minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;border-radius:var(--radius-lg);transition:var(--tr)}
.flow>summary::-webkit-details-marker{display:none}
.flow>summary:hover{background:var(--bg-surface-hover)}
.flow>summary .chev{transition:transform 150ms ease;color:var(--text-muted)}
.flow[open]>summary .chev{transform:rotate(90deg)}
.flow>summary .t{font-weight:600;font-size:14.5px;min-width:0}
.flow>summary .tags{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.flow-body{padding:4px 16px 16px 16px;border-top:1px solid var(--border-subtle);display:flex;flex-direction:column;gap:16px}
.fmeta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding-top:12px}
.fmeta div{font-size:13.5px}
.fmeta b,.fblock>b{display:block;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);margin-bottom:3px}
.fsteps{border:1px solid var(--border-subtle);border-radius:8px;overflow:hidden}
.fstep{display:grid;grid-template-columns:28px minmax(120px,170px) minmax(0,1fr) minmax(0,1.25fr) 32px;gap:12px;padding:9px 10px;border-top:1px solid var(--border-subtle);align-items:start;font-size:13.5px}
.fstep:first-child{border-top:0}
.fstep.h{background:var(--bg-app);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);padding:7px 10px}
.fstep .n{font-family:var(--font-mono);font-size:11.5px;color:var(--text-muted);padding-top:2px}
.fstep .scr{font-size:12.5px;color:var(--text-secondary);font-weight:500}
.fstep .cbtn{padding:0 6px}
.fstep .cbtn span{display:none}
.fstep .cwrap{grid-column:2 / -1;margin-top:0}
.fblock ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--text-secondary)}
.fblock ul li b{color:var(--text-primary);font-weight:550}
.rel{display:flex;gap:6px;flex-wrap:wrap}

/* ── Questions ── */
.qs{display:flex;flex-direction:column;gap:10px}
.q{background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--radius-lg);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.q-head{display:flex;gap:8px;align-items:center}
.q-title{font-size:15px;font-weight:600;letter-spacing:-.005em;text-wrap:balance}
.q-ctx{font-size:13px;color:var(--text-secondary);margin:0}
.q-opts{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.q-opts li{font-size:12.5px;border:1px dashed var(--border-strong);border-radius:6px;padding:3px 9px;color:var(--text-secondary)}
.rec{display:flex;gap:10px;font-size:13.5px;background:var(--bg-app);border:1px solid var(--border-subtle);border-radius:8px;padding:9px 12px}
.rec b{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);white-space:nowrap;padding-top:2px}

/* ── Rules ── */
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0}
.chain .arrow{color:var(--text-disabled)}
.rules{margin:8px 0 0;padding-left:18px;font-size:13.5px;color:var(--text-secondary);display:flex;flex-direction:column;gap:3px}

/* ── Design system ── */
.ds-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ds-panel{background:var(--bg-app);color:var(--text-primary);border:1px solid var(--border-default);border-radius:var(--radius-lg);overflow:hidden}
.ds-panel .ds-top{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--border-default);background:var(--bg-sidebar);font-size:12px;color:var(--text-muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.ds-inner{display:grid;grid-template-columns:150px minmax(0,1fr);min-height:420px}
.ds-side{background:var(--bg-sidebar);border-right:1px solid var(--border-default);padding:10px 8px;display:flex;flex-direction:column;gap:2px}
.ds-side .nav-item{height:32px;font-size:13px;padding:0 8px;gap:8px}
.ds-side .nav-item .i{width:15px;height:15px}
.ds-main{padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ds-main .h{font-size:18px;font-weight:680;letter-spacing:-.02em}
.ds-today{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:10px}
.nowcard{border:1px solid var(--border-default);border-radius:8px;background:var(--bg-surface);padding:10px;display:flex;flex-direction:column;gap:6px}
.nowcard .lbl{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}
.nowcard .big{font-size:15px;font-weight:650;letter-spacing:-.01em;display:flex;align-items:center;gap:6px}
.nowcard .big i{width:8px;height:8px;border-radius:2px;background:var(--accent-blue)}
.nowcard .timer{font:600 20px var(--font-sans);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.nowcard .task{font-size:12.5px;color:var(--text-secondary)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{height:26px;display:inline-flex;align-items:center;gap:8px;padding:0 8px;border-radius:5px;font-size:12px;font-weight:500;border:1px solid}
.pill small{font-weight:400;opacity:.85;font-variant-numeric:tabular-nums}
.swatches{width:100%;border-collapse:collapse;font-size:12.5px}
.swatches td,.swatches th{padding:6px 10px;border-top:1px solid var(--border-subtle);text-align:left}
.swatches th{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);border-top:0}
.sw{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:11.5px;color:var(--text-secondary)}
.sw i{width:22px;height:16px;border-radius:4px;border:1px solid rgba(128,128,128,.35)}
.table-wrap{overflow-x:auto;border:1px solid var(--border-default);border-radius:var(--radius-lg);background:var(--bg-surface)}

/* ── Export ── */
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border:1px solid var(--border-default);border-radius:var(--radius-lg);background:var(--bg-surface)}
.stats div{padding:12px 14px;border-left:1px solid var(--border-subtle)}
.stats div:first-child{border-left:0}
.stats b{display:block;font-size:22px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--text-muted)}
.md-preview{margin:0;max-height:420px;overflow:auto;background:var(--bg-app);border:1px solid var(--border-default);border-radius:var(--radius-lg);padding:14px;font:12.5px/1.55 var(--font-mono);color:var(--text-secondary);white-space:pre-wrap;word-break:break-word}
.check{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--text-secondary);cursor:pointer}
.check input{accent-color:var(--accent-blue)}

/* ── Search results ── */
.res{display:grid;grid-template-columns:132px minmax(0,1fr) auto;gap:14px;padding:10px 14px;border-top:1px solid var(--border-subtle);cursor:pointer;align-items:center;transition:var(--tr)}
.res:first-child{border-top:0}
.res:hover{background:var(--bg-surface-hover)}
mark{background:var(--pill-yellow-bg);color:var(--pill-yellow-fg);border-radius:3px;padding:0 1px}

/* ── Toast ── */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);background:var(--bg-elevated);border:1px solid var(--border-strong);color:var(--text-primary);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity 160ms ease,transform 160ms ease;z-index:50}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ── Theme transition ── */
/* Tema: o claro é sempre a camada de cima, recortada por um círculo centrado no botão */
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
html.vt-open::view-transition-old(root){z-index:1}
html.vt-open::view-transition-new(root){z-index:2}
html.vt-close::view-transition-old(root){z-index:2}
html.vt-close::view-transition-new(root){z-index:1}
.tx-demos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tx{display:flex;flex-direction:column;gap:8px}
.tx>span{font-size:13px;color:var(--text-secondary);display:flex;flex-direction:column;gap:2px}
.tx>span b{color:var(--text-primary);font-weight:600}
.tx-stage{position:relative;height:130px;border-radius:10px;overflow:hidden;background:#141416;border:1px solid var(--border-default)}
.tx-stage::before{content:"";position:absolute;left:0;top:0;bottom:0;width:26%;background:#1C1C1E;border-right:1px solid #303033}
.tx-c{position:absolute;left:30px;bottom:22px;width:20px;height:20px;margin:0 0 -10px -10px;border-radius:50%;background:#F6F6F7;transform:scale(0)}
.tx-c.open{animation:tx-open 3.2s cubic-bezier(.22,.61,.36,1) infinite}
.tx-c.close{animation:tx-close 3.2s cubic-bezier(.65,0,.35,1) infinite}
.tx-btn{position:absolute;left:18px;bottom:10px;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;background:#28282A;border:1px solid #39393C;color:#F3F3F4;z-index:1}
.tx-btn .i{width:13px;height:13px}
@keyframes tx-open{0%,18%{transform:scale(0)}58%,88%{transform:scale(34)}100%{transform:scale(34);opacity:0}}
@keyframes tx-close{0%,18%{transform:scale(34)}55%,88%{transform:scale(0)}100%{transform:scale(0)}}
@media (prefers-reduced-motion: reduce){
  *{transition:none!important;animation:none!important}
}

/* ── Responsive ── */
@media (max-width: 1100px){
  .grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ds-pair{grid-template-columns:minmax(0,1fr)}
  .cycle{grid-template-columns:minmax(0,1fr)}
  .questions6{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width: 900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:min(300px,86vw);height:auto;z-index:40;transform:translateX(-102%);transition:transform 200ms ease;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  body.menu-open .sidebar{transform:none}
  body.menu-open .scrim{display:block}
  .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:39}
  .mhead{display:flex;align-items:center;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:52px;padding:0 12px;background:var(--bg-sidebar);border-bottom:1px solid var(--border-default)}
  .mhead .brand{padding:0;font-size:15px}
  .mhead .sp{flex:1}
  .page{padding:20px 16px 72px}
  .grid2,.grid3,.fmeta,.touch .io,.howto,.layers,.tx-demos{grid-template-columns:minmax(0,1fr)}
  .howto>div{border-left:0;border-top:1px solid var(--border-subtle)}
  .howto>div:first-child{border-top:0}
  .layers .axis{display:none}
  .row{grid-template-columns:minmax(0,1fr)}
  .row .cwrap{grid-column:1}
  .res{grid-template-columns:minmax(0,1fr)}
  .fstep{grid-template-columns:24px minmax(0,1fr) 32px}
  .fstep.h{display:none}
  .fstep .scr{grid-column:2}
  .fstep .eu,.fstep .app-r{grid-column:2}
  .fstep .cbtn{grid-column:3;grid-row:1}
  .flow>summary{grid-template-columns:auto 44px minmax(0,1fr)}
  .flow>summary .tags{grid-column:2 / -1;justify-content:flex-start}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stats div{border-left:0;border-top:1px solid var(--border-subtle)}
  .ds-inner{grid-template-columns:minmax(0,1fr)}
  .ds-side{display:none}
  .ds-today{grid-template-columns:minmax(0,1fr)}
  .questions6{grid-template-columns:minmax(0,1fr)}
  .prog{grid-template-columns:minmax(0,1fr) 60px}
  .prog .bar{grid-column:1 / -1;grid-row:2}
  .touch{grid-template-columns:48px 18px minmax(0,1fr);gap:0 8px}
}

/* ── Wireframe kit ── */
.i.xs{width:11px;height:11px}
.pin{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--accent-blue);color:#fff;font:700 9.5px/1 var(--font-sans);flex:none;box-shadow:0 0 0 2px var(--bg-app);vertical-align:middle;margin-left:4px;font-style:normal;letter-spacing:0;text-transform:none}
.wfig{margin:0;display:flex;flex-direction:column;gap:12px;min-width:0}
.wf-scroll{overflow-x:auto;padding:2px;margin:-2px}
.wfig.desktop .wf{min-width:620px}
.wfig figcaption{display:flex;flex-direction:column;gap:8px}
.wfig-t{display:flex;align-items:center;gap:8px;font-size:13px}
.wfig-t b{font-weight:600}
.wfig-t .i{color:var(--text-muted)}
.wf-notes{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 16px;font-size:12.5px;color:var(--text-secondary)}
.wf-notes li{display:flex;gap:8px;align-items:flex-start}
.wf-notes .pin{margin:1px 0 0}

.wf{font-size:11px;line-height:1.35;border:1px solid var(--border-strong);border-radius:12px;background:var(--bg-app);overflow:hidden;color:var(--text-primary);position:relative;text-align:left}
.wf .i{width:13px;height:13px}
.wf .i.sm{width:13px;height:13px}
.wf-chrome{height:28px;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--bg-sidebar);border-bottom:1px solid var(--border-default)}
.wf-chrome>i{width:9px;height:9px;border-radius:50%;background:#FF5F57}
.wf-chrome>i:nth-child(2){background:#FEBC2E}
.wf-chrome>i:nth-child(3){background:#28C840}
.wf-chrome .t{flex:1;text-align:center;color:var(--text-muted);font-size:10.5px;font-weight:500;margin-right:40px}
.wf-app{display:grid;grid-template-columns:112px minmax(0,1fr);min-height:280px;position:relative}
.wf-app.noside{grid-template-columns:minmax(0,1fr)}
.wf-side{background:var(--bg-sidebar);border-right:1px solid var(--border-default);padding:8px 6px;display:flex;flex-direction:column;gap:1px}
.wf-side .b{display:flex;gap:6px;align-items:center;font-weight:650;font-size:11px;padding:2px 5px 9px}
.wf-side .b img{width:15px;height:15px;border-radius:4px}
.wf-nav{display:flex;align-items:center;gap:6px;height:23px;padding:0 6px;border-radius:5px;color:var(--text-muted);font-weight:500;font-size:10.5px}
.wf-nav em{margin-left:auto;font-style:normal;font-size:9px;border:1px solid var(--border-default);border-radius:4px;padding:0 4px}
.wf-nav.on{background:var(--bg-surface-active);color:var(--text-primary)}
.wf-side-foot{margin-top:auto;display:flex;align-items:center;gap:5px;font-size:9.5px;color:var(--text-muted);padding:4px 6px}
.wf-side-foot .i{color:var(--accent-green)}
.wf-main{padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0;position:relative}
.wf-h{display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.wf-title{font-size:14px;font-weight:680;letter-spacing:-.02em;display:flex;align-items:center;gap:6px}
.wf-title.xl{font-size:20px}
.wf-sub{font-size:10px;color:var(--text-muted);font-weight:400}
.wf-sub.pad{padding:2px 2px 4px}
.wf-sub.center{text-align:center}
.wf-hero{display:flex;flex-direction:column;gap:2px;padding:4px 0}
.wf-row{display:flex;align-items:center;gap:6px;min-width:0}
.wf-row.wrap{flex-wrap:wrap}
.wf-row.end{justify-content:flex-end}
.wf-row.sp{justify-content:space-between}
.wf .sp,.wf-phone .sp{flex:1}
.wf-col{display:flex;flex-direction:column;gap:8px;min-width:0}
.wf-col.tight{gap:4px;align-items:flex-start}
.wf-split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:10px;align-items:start}
.wf-split.r{grid-template-columns:minmax(0,1fr) minmax(0,1.05fr)}
.wf-cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.wf-cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:start}
.wf-btn{height:22px;padding:0 8px;border-radius:5px;border:1px solid var(--border-input);background:var(--bg-button);font-size:10.5px;font-weight:500;display:inline-flex;align-items:center;gap:4px;white-space:nowrap;color:var(--text-primary)}
.wf-btn.pri{background:var(--text-primary);color:var(--bg-app);border-color:transparent;font-weight:600}
.wf-btn.ghost{background:transparent;border-color:transparent;color:var(--text-secondary)}
.wf-card{background:var(--bg-surface);border:1px solid var(--border-default);border-radius:8px;padding:9px 10px;display:flex;flex-direction:column;gap:6px;min-width:0;position:relative}
.wf-card.hl{border-color:var(--pill-orange-bd)}
.wf-card.center{align-items:center;text-align:center;gap:7px;padding:18px}
.wf-card.sm{padding:7px 8px;gap:4px}
.wf-card.now{border-color:var(--pill-blue-bd)}
.wf-lbl{font-size:9px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--text-muted);display:flex;align-items:center;gap:2px}
.wf-lbl .n{font-style:normal;margin-left:4px}
.wf-grp{font-size:9.5px;color:var(--text-muted);font-weight:600;margin-top:4px}
.wf-seg{display:inline-flex;padding:2px;border:1px solid var(--border-default);background:var(--bg-segmented);border-radius:6px;gap:1px}

.wf-stepper .st b{width:16px;height:16px;border-radius:50%;border:1px solid var(--border-strong);display:grid;place-items:center;font-size:9px}
.wf-stepper .st b .i{width:9px;height:9px}
.wf-stepper .st.on{color:var(--text-primary)}
.wf-stepper .st.on b{background:var(--text-primary);color:var(--bg-app);border-color:transparent}
.wf-stepper .st.done b{background:var(--pill-green-bg);color:var(--pill-green-fg);border-color:var(--pill-green-bd)}
.wf-dot{width:7px;height:7px;border-radius:2px;flex:none;display:inline-block}

.caret{width:1px;height:13px;background:var(--focus);margin-left:1px}
.wf-logo{width:40px;height:40px;border-radius:10px}
.wf-onb{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:12px;padding:14px;align-items:center}

.wf-split>.wf-card .wf-li:first-of-type{border-top:0}
.wf-banner{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;border:1px solid var(--pill-blue-bd);background:var(--pill-blue-bg);color:var(--pill-blue-fg);flex-wrap:wrap}
.wf-banner>div{display:flex;flex-direction:column}
.wf-banner b{font-weight:600;font-size:11px}
.wf-banner span{font-size:10px;opacity:.85}
.wf-banner.warn{border-color:var(--pill-orange-bd);background:var(--pill-orange-bg);color:var(--pill-orange-fg)}
.wf-banner.sm{padding:5px 8px;font-size:10px}
.wf-banner .wf-btn{color:var(--text-primary)}
.wf-ev{display:flex;align-items:center;gap:6px;height:22px;padding:0 7px;border-radius:5px;border:1px solid;font-size:10.5px;font-weight:500}
.wf-ev em{margin-left:auto;font-style:normal;opacity:.8;font-size:9.5px}
.wf-ev.aw{border-style:dashed;border-color:var(--border-strong);color:var(--text-secondary)}
.wf-issue{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--border-subtle);flex-wrap:wrap}
.wf-issue>.i{color:var(--pill-orange-fg)}
.wf-issue>div{display:flex;flex-direction:column}
.wf-issue b{font-size:11px;font-weight:600}
.wf-issue span{font-size:10px;color:var(--text-muted)}
.wf-start{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border-strong);border-radius:8px;background:var(--bg-surface)}
.wf-start>div{display:flex;flex-direction:column}
.wf-start b{font-size:12px;display:flex;gap:6px;align-items:center}
.wf-start b .i{color:var(--accent-green)}
.wf-toast{align-self:center;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:7px;background:var(--bg-elevated);border:1px solid var(--border-strong);font-size:10.5px}
.wf-toast .i{color:var(--accent-green)}
.wf-legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:10px;color:var(--text-secondary)}
.wf-legend span{display:inline-flex;align-items:center;gap:5px}
.lg{width:14px;height:9px;border-radius:3px;display:inline-block;border:1px solid var(--pill-purple-fg)}
.lg.prov{border-style:dashed}
.lg.acc{background:var(--pill-purple-bg);border-color:var(--pill-purple-bd)}
.wf-alloc{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.25fr) minmax(0,.85fr);gap:10px;align-items:start}
.wf-card.tasks{gap:4px}
.wf-active{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) minmax(0,.9fr);gap:10px;align-items:start}
.wf-diff{display:flex;align-items:center;gap:6px;font-size:10.5px;flex-wrap:wrap}
.wf-diff .old{text-decoration:line-through;color:var(--text-muted)}
.wf-diff .new{color:var(--pill-purple-fg);background:var(--pill-purple-bg);border-radius:4px;padding:1px 5px}
.wf-cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.wf-revs{display:flex;flex-direction:column}
.wf-rev{display:grid;grid-template-columns:8px 34px minmax(0,1fr);gap:8px;align-items:start;padding:6px 0;position:relative}
.wf-rev>i{width:8px;height:8px;border-radius:50%;margin-top:3px}
.wf-rev .mono{font-size:10px;color:var(--text-muted)}
.wf-rev div{display:flex;flex-direction:column}
.wf-rev b{font-size:10.5px}
.wf-rev span{font-size:10px;color:var(--text-muted)}
.wf-field{display:flex;flex-direction:column;gap:4px;font-size:10px;color:var(--text-muted)}
.wf-ok{display:inline-flex;align-items:center;gap:6px;font-size:10px;color:var(--pill-green-fg)}
.wf-err{display:inline-flex;align-items:center;gap:6px;font-size:10px;color:var(--pill-pink-fg)}
.wf-close{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:10px;align-items:start}
.wf-back{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text-muted);padding-left:4px}
.wf-refl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:start}
.wf-energy{display:flex;gap:4px;margin-top:4px}
.wf-energy i,.wf-sessions i{width:12px;height:12px;border-radius:50%;border:1px solid var(--border-strong)}
.wf-energy i.on{background:var(--accent-yellow);border-color:transparent}
.wf-sessions{display:flex;gap:5px}
.wf-sessions i.on{background:var(--accent-orange);border-color:transparent}
.wf-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) 0;border:1px solid var(--border-default);border-radius:8px;background:var(--bg-surface);position:relative}
.wf-stats>div{padding:8px 10px;border-left:1px solid var(--border-subtle);display:flex;flex-direction:column}
.wf-stats>div:first-child{border-left:0}
.wf-stats b{font-size:17px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.wf-stats span{font-size:9.5px;color:var(--text-muted)}
.wf-stats>.pin{position:absolute;right:6px;top:6px}
.wf-stack{display:flex;height:12px;border-radius:4px;overflow:hidden;gap:2px}
.wf-stack i{display:block;height:100%}
.wf-cont{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--border-subtle);flex-wrap:wrap}
.wf-cont:first-of-type{border-top:0}
.wf-cont>div{display:flex;flex-direction:column}
.wf-cont b{font-size:11.5px}
.wf-cont span{font-size:10px;color:var(--text-muted)}
.wf-cont .wf-bar{max-width:70px}
.wf-ghostlines{display:flex;flex-direction:column;gap:7px;padding:6px 0}
.wf-ghostlines i{display:block;height:9px;border-radius:4px;background:var(--bg-surface-hover)}
.wf-ghostlines i:nth-child(2n){width:72%}
.wf-ghostlines i:nth-child(3n){width:55%}
.wf-overlay{position:absolute;inset:0;background:rgba(0,0,0,.38);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:26px;gap:10px;z-index:4}
.wf-palette{width:min(380px,80%);background:var(--bg-elevated);border:1px solid var(--border-strong);border-radius:10px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.wf-pin-in{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--border-default);font-size:12px}
.wf-pin-in span{flex:1}
.wf-cmds{padding:4px;position:relative}
.wf-cmd{display:flex;align-items:center;gap:8px;height:24px;padding:0 8px;border-radius:5px;font-size:10.5px}
.wf-cmd b{font-weight:500}
.wf-cmd span{color:var(--text-muted);flex:1}
.wf-cmd.on{background:var(--bg-surface-active)}
.wf-cmds>.pin{position:absolute;right:8px;top:36px}
.wf-dialog{align-self:center;width:min(420px,92%);background:var(--bg-elevated);border:1px solid var(--border-strong);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:9px;margin-top:10px}
.wf-q{display:flex;align-items:center;gap:6px;padding:5px 0;border-top:1px solid var(--border-subtle);flex-wrap:wrap}
.wf-q:first-of-type{border-top:0}
.wf-q b{font-weight:600;font-size:10.5px}
.wf-hist{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:start}
.wf-cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wf-cal .dh{font-size:9px;color:var(--text-muted);text-align:center}
.wf-day{border:1px solid var(--border-subtle);border-radius:6px;background:var(--bg-surface);padding:4px;display:flex;flex-direction:column;gap:4px;min-height:44px;position:relative}
.wf-day>span{font-size:9.5px;color:var(--text-secondary);font-variant-numeric:tabular-nums}
.wf-day.sel{border-color:var(--focus)}
.wf-day .shape{display:flex;gap:1px;height:16px;align-items:stretch;margin-top:auto}
.wf-day .shape i{flex:1;border-radius:1px}
.wf-day .pin{position:absolute;right:2px;top:2px;width:14px;height:14px;font-size:8.5px}
.wf-day em{position:absolute;right:3px;top:3px;font-style:normal;font-size:7.5px;border-radius:3px;padding:0 3px}
.wf-day em.auto{background:var(--pill-yellow-bg);color:var(--pill-yellow-fg)}
.wf-day em.open{background:var(--pill-blue-bg);color:var(--pill-blue-fg)}
.wf-triage{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:6px 7px;border:1px dashed var(--focus);border-radius:6px;margin:-2px 0 4px}
.wf-card.list{gap:4px}
.wf-more{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--text-muted);border-top:1px solid var(--border-subtle);padding-top:5px}
.wf-hbar{display:grid;grid-template-columns:58px minmax(0,1fr);gap:8px;align-items:center;font-size:10px}
.wf-hbar div{position:relative;height:9px;background:var(--border-subtle);border-radius:3px}
.wf-hbar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.wf-hbar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text-muted);border-radius:1px}
.wf-vbars{display:flex;gap:10px;align-items:flex-end;height:78px}
.wf-vbars>div{display:grid;grid-template-columns:8px 8px;gap:2px;align-items:end;position:relative;padding-bottom:12px}
.wf-vbars span{display:block;border-radius:2px 2px 0 0}
.wf-vbars span.p{background:var(--border-strong)}
.wf-vbars em{position:absolute;bottom:0;left:-4px;font-style:normal;font-size:8.5px;color:var(--text-muted)}
.wf-mult{display:flex;align-items:center;gap:10px;padding:4px 0}
.wf-mult b{font-size:18px;font-weight:650;letter-spacing:-.02em;color:var(--pill-orange-fg);min-width:44px}
.wf-mult span{font-size:10px;color:var(--text-muted)}
.wf-shape{display:flex;flex-direction:column;gap:3px}
.wf-shape>div{display:grid;grid-template-columns:12px repeat(8,minmax(0,1fr));gap:2px;align-items:center}
.wf-shape span{font-size:9px;color:var(--text-muted)}
.wf-shape i{height:10px;border-radius:2px}
.wf-settings{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px}
.wf-slist{display:flex;flex-direction:column;gap:1px}
.wf-slist span{font-size:10.5px;padding:4px 7px;border-radius:5px;color:var(--text-muted)}
.wf-slist span.on{background:var(--bg-surface-active);color:var(--text-primary)}
.wf-cut{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--text-secondary)}

/* timeline */
.wf-tl{position:relative;border:1px solid var(--grid-line);border-radius:8px;background:var(--bg-app);min-width:0}
.wf-hr{position:absolute;left:0;right:0;border-top:1px solid var(--grid-line)}
.wf-hr:first-child{border-top:0}
.wf-hr span{position:absolute;left:5px;top:1px;font-size:8.5px;color:var(--text-disabled);font-variant-numeric:tabular-nums}
.wf-blk{position:absolute;border:1px solid;border-radius:5px;padding:1px 6px;overflow:hidden;display:flex;flex-direction:column;gap:2px;z-index:1}
.wb-h{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:600;line-height:1.25;white-space:nowrap;min-height:11px}
.wb-n{display:inline-flex;align-items:center;gap:4px;min-width:0;flex:1;overflow:hidden}
.wb-n>span{overflow:hidden;text-overflow:ellipsis}
.wb-t{font-size:9px;font-weight:500;opacity:.75;font-variant-numeric:tabular-nums}
.wb-cap{font-size:9px;font-weight:600;font-variant-numeric:tabular-nums;opacity:.85}
.wb-cap.over{opacity:1;background:var(--pill-orange-bg);color:var(--pill-orange-fg);border:1px solid var(--pill-orange-bd);border-radius:4px;padding:0 4px}
.wf-blk .pin{width:14px;height:14px;font-size:8.5px}
.wf-blk.prov{background:transparent;border-style:dashed}
.wf-blk.sel{box-shadow:0 0 0 2px var(--focus);z-index:2}
.wf-blk.ghost{background:transparent;border-style:dashed;opacity:.7}
.wf-blk.dim{opacity:.35}
.wf-blk.warn{background-image:repeating-linear-gradient(135deg,transparent 0 6px,rgba(239,107,46,.22) 6px 9px)}
.wf-blk.gap{background:repeating-linear-gradient(135deg,var(--pill-orange-bg) 0 5px,transparent 5px 10px);border:1px dashed var(--pill-orange-bd);color:var(--pill-orange-fg)}
.wb-tasks{display:flex;flex-direction:column;gap:2px}
.wb-task{display:flex;align-items:center;gap:5px;font-size:9.5px;font-weight:500}
.wb-task .cb{border-color:currentColor;opacity:.8}
.wb-task em{margin-left:auto;font-style:normal;opacity:.7;font-size:9px}
.wb-drop{border:1px dashed currentColor;border-radius:4px;font-size:9px;text-align:center;opacity:.8;padding:1px}
.wb-edit{font-size:9px;opacity:.85}
.wf-now{position:absolute;left:0;right:0;height:0;border-top:1.5px solid var(--accent-pink);z-index:3}
.wf-now::before{content:"";position:absolute;left:-1px;top:-4px;width:7px;height:7px;border-radius:50%;background:var(--accent-pink)}
.wf-now span{position:absolute;right:4px;top:-8px;font-size:8.5px;font-weight:700;color:#fff;background:var(--accent-pink);padding:0 4px;border-radius:3px;font-variant-numeric:tabular-nums}

/* phone + widgets */
.wf-phones{display:flex;gap:24px;justify-content:center;flex-wrap:wrap;padding:6px 0}
.wf-phone{width:236px;border-radius:32px;border:1px solid var(--border-strong);background:var(--bg-app);padding:10px 10px 8px;display:flex;flex-direction:column;gap:8px;font-size:11px;color:var(--text-primary);position:relative;box-shadow:inset 0 0 0 4px var(--bg-sidebar)}
.wf-phone .i{width:13px;height:13px}
.ph-top{display:flex;align-items:center;justify-content:space-between;padding:4px 12px 0;font-size:10px;font-weight:600}
.ph-top .notch{width:64px;height:18px;border-radius:10px;background:var(--text-primary);opacity:.9}
.ph-body{display:flex;flex-direction:column;gap:7px;padding:0 4px;min-height:370px;position:relative}
.ph-home{width:80px;height:4px;border-radius:3px;background:var(--text-muted);margin:4px auto 0}
.ph-h{display:flex;align-items:baseline;justify-content:space-between;padding:2px}
.ph-h b{font-size:17px;font-weight:680;letter-spacing:-.02em}
.ph-tabs{margin-top:auto;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--border-default);padding:6px 2px 0;position:relative}
.ph-tabs span{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:8.5px;color:var(--text-muted)}
.ph-tabs span.on{color:var(--text-primary)}
.ph-tabs .fab{width:32px;height:32px;border-radius:50%;background:var(--text-primary);color:var(--bg-app);justify-content:center}
.ph-tabs>.pin{position:absolute;right:-4px;top:-8px}
.ph-sheet{margin-top:auto;margin-left:-14px;margin-right:-14px;margin-bottom:-8px;background:var(--bg-elevated);border-top:1px solid var(--border-strong);border-radius:16px 16px 0 0;padding:12px 12px 10px;display:flex;flex-direction:column;gap:8px}
.ph-kb{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;margin-top:4px}
.ph-kb i{height:22px;border-radius:4px;background:var(--bg-surface-hover);font-style:normal;font-size:9px;display:grid;place-items:center;color:var(--text-secondary)}
.ph-wall{display:flex;flex-direction:column;gap:8px;min-height:370px;background:linear-gradient(160deg,var(--pill-blue-bg),var(--pill-purple-bg) 55%,var(--pill-green-bg));margin:-2px -6px;padding:10px 8px;border-radius:18px}
.wd{background:var(--bg-surface);border:1px solid var(--border-default);border-radius:14px;padding:9px 10px;display:flex;flex-direction:column;gap:4px;position:relative;font-size:10px;min-width:0}
.wd>.pin{position:absolute;right:6px;top:6px}
.wd.big b{font-size:15px;display:flex;align-items:center;gap:6px}
.wd-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.wd-l{display:flex;align-items:center;gap:5px;font-size:9.5px;white-space:nowrap;overflow:hidden}
.wd-l em{font-style:normal;color:var(--text-muted);width:12px;font-variant-numeric:tabular-nums}
.ph-apps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:8px 10px;margin-top:auto}
.ph-apps i{aspect-ratio:1;border-radius:11px;background:var(--bg-surface);opacity:.65}
.ph-lock{display:flex;flex-direction:column;align-items:center;gap:8px;min-height:370px;padding-top:24px}
.lk-time{font-size:44px;font-weight:300;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.lk-date{font-size:11px;color:var(--text-secondary);margin-top:-8px}
.wd.glass{width:100%;margin-top:16px;align-items:flex-start}

/* ── Storyboard / scenes ── */
.scene{display:grid;grid-template-columns:minmax(260px,330px) minmax(0,1fr);gap:20px;align-items:start}
.scene .narr{display:flex;flex-direction:column;gap:10px;min-width:0}
.touch.has-wf .body{padding-bottom:28px}
.daystrip{position:relative;height:74px;margin-top:6px}
.daystrip .axisl{position:absolute;left:0;right:0;top:34px;height:6px;border-radius:4px;background:linear-gradient(90deg,var(--pill-purple-bg),var(--pill-blue-bg) 20%,var(--pill-blue-bg) 80%,var(--pill-orange-bg))}
.daystrip .tick{position:absolute;top:44px;font-size:10.5px;color:var(--text-muted);transform:translateX(-50%);font-variant-numeric:tabular-nums}
.daystrip button{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:0;cursor:pointer;color:var(--text-secondary)}
.daystrip button i{width:12px;height:12px;border-radius:50%;background:var(--sc);border:2px solid var(--bg-app);margin-top:24px}
.daystrip button span{font-size:10px;font-variant-numeric:tabular-nums;position:absolute;top:0;white-space:nowrap}
.daystrip button:nth-child(even) span{top:auto;bottom:-40px}
.daystrip button:hover i{transform:scale(1.3)}
.ds-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--text-muted);margin-top:22px}
.ds-legend span{display:inline-flex;align-items:center;gap:6px}
.ds-legend i{width:9px;height:9px;border-radius:50%;background:var(--sc)}

/* flow extras */
.fstrip{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:4px 0 2px}
.fnode{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:78px;max-width:96px;text-align:center;position:relative;flex:1}
.fnode .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--bg-app);border:1px solid var(--border-default);color:var(--text-secondary);position:relative;z-index:1}
.fnode .ic .i{width:16px;height:16px}
.fnode small{font-size:10.5px;color:var(--text-muted);line-height:1.25}
.fnode b{position:absolute;top:-4px;left:calc(50% + 10px);font:600 9px var(--font-mono);color:var(--text-muted);z-index:2;background:var(--bg-surface);padding:0 2px}
.fnode:not(:last-child)::after{content:"";position:absolute;top:16px;left:calc(50% + 16px);right:calc(-50% + 16px);border-top:1px dashed var(--border-strong)}
.fgal{display:flex;flex-direction:column;gap:10px}
.fgal-tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fgal-tabs .muted{font-size:12px}

/* diagrams */
.dia{border:1px solid var(--border-default);border-radius:var(--radius-lg);background:var(--bg-surface);padding:18px;overflow-x:auto}
.ia-cols{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:10px;min-width:760px}
.ia-node{border:1px solid var(--border-default);border-radius:9px;background:var(--bg-app);padding:10px;display:flex;flex-direction:column;gap:8px}
.ia-node.main{border-color:var(--pill-blue-bd);box-shadow:inset 0 2px 0 var(--accent-blue)}
.ia-node h4{margin:0;font-size:13.5px;display:flex;align-items:center;gap:7px}
.ia-node p{margin:0;font-size:11.5px;color:var(--text-muted)}
.ia-node ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
.ia-node li{font-size:11.5px;padding:3px 7px;border-radius:5px;background:var(--bg-surface-hover);color:var(--text-secondary)}
.ia-bar{margin-top:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px;border:1px dashed var(--border-strong);border-radius:9px;min-width:760px}
.ia-bar>b{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);margin-right:4px}
.ia-bar span{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border-radius:6px;border:1px solid var(--border-default);background:var(--bg-app);font-size:12px}
.ia-top{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:12px;color:var(--text-muted);min-width:760px}
.ia-top .line{flex:1;border-top:1px solid var(--border-default)}
.lc{display:grid;grid-template-columns:repeat(9,auto);align-items:start;justify-content:start;gap:0;min-width:900px;row-gap:8px}
.lc-node{display:flex;flex-direction:column;align-items:center;gap:6px;width:118px;text-align:center}
.lc-node .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;border:1px solid;background:var(--bg-app)}
.lc-node .ic .i{width:20px;height:20px}
.lc-node b{font-size:13px}
.lc-node span{font-size:11px;color:var(--text-muted)}
.lc-edge{display:flex;flex-direction:column;align-items:center;gap:7px;width:108px;text-align:center;padding-top:20px}
.lc-edge span{font-size:10.5px;color:var(--text-secondary);font-weight:500;line-height:1.25}
.lc-edge i{display:block;width:100%;height:1px;background:var(--border-strong);position:relative}

.lc-loop{grid-row:2;border:1px dashed var(--border-strong);border-top:0;height:20px;border-radius:0 0 10px 10px;position:relative;margin:0 59px}

.om{display:grid;grid-template-columns:minmax(150px,.8fr) 70px minmax(300px,1.6fr) 70px minmax(170px,.9fr);align-items:center;min-width:860px}

.om-day{border:1.5px solid var(--pill-blue-bd);border-radius:12px;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--bg-app)}

.om-arrow{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:var(--text-muted);text-align:center;padding:0 6px}

.fs{border:1px solid var(--border-default);border-radius:9px;background:var(--bg-app);padding:10px;display:flex;flex-direction:column;gap:6px;position:relative}

.fs.key{border-color:var(--pill-green-bd);box-shadow:inset 0 2px 0 var(--accent-green)}
.fast{grid-column:1 / -1;display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:8px;margin-top:4px}

.pipe .zone{display:flex;align-items:center;flex:1}
.pipe-z{display:flex;gap:8px;min-width:860px;margin-bottom:12px}
.pipe-z span{flex:1;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted);border-bottom:1px solid var(--border-default);padding-bottom:4px}

.hero-wf{margin-top:24px;display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start}
.hero-wf .side-note{display:flex;flex-direction:column;gap:10px;font-size:13px;color:var(--text-secondary)}

@media (max-width: 1100px){
  .scene,.hero-wf{grid-template-columns:minmax(0,1fr)}

}

/* storyboard strip */
.dstrip{display:grid;gap:6px 0;min-width:760px}
.dstrip button{grid-row:1;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;cursor:pointer;color:var(--text-secondary);font:500 10.5px var(--font-sans);font-variant-numeric:tabular-nums;padding:2px 0;position:relative}
.dstrip button::before{content:"";position:absolute;left:0;right:0;bottom:7px;border-top:1px solid var(--border-default)}
.dstrip button:first-child::before{left:50%}
.dstrip button:nth-child(18)::before{right:50%}
.dstrip button i{width:12px;height:12px;border-radius:50%;background:var(--sc);border:2px solid var(--bg-surface);position:relative;z-index:1;transition:transform 120ms ease}

/* stage wireframes */
.wf-qz{display:flex;flex-direction:column;gap:5px;padding:6px 0;border-top:1px solid var(--border-subtle)}

.wf-log>div{display:grid;grid-template-columns:38px 150px minmax(0,1fr);gap:8px;padding:5px 10px;border-top:1px solid var(--border-subtle);font-size:10px;align-items:center}
.wf-log>div:first-child{border-top:0}
.wf-log .mono{font-size:9.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wf-log b.mono{color:var(--pill-blue-fg);font-weight:600}
.wf-card>.pin:first-child{position:absolute;right:8px;top:8px}
.wf-metric{display:grid;grid-template-columns:14px minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--border-subtle);font-size:10.5px}
.wf-metric:first-of-type{border-top:0}
.wf-metric .i{color:var(--accent-green)}
.wf-metric:has(.i path[d^="M18"]) .i{color:var(--accent-pink)}
.wf-metric span{font-variant-numeric:tabular-nums;font-weight:600}
.wf-metric em{font-style:normal;color:var(--text-muted);font-size:9.5px}
.wf-live{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--pill-green-fg)}
.wf-live i{width:7px;height:7px;border-radius:50%;background:var(--accent-green);box-shadow:0 0 0 3px var(--pill-green-bg)}
.wf-cmp3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,1.1fr);gap:8px;align-items:start}
.wb-badge{font-size:8.5px;font-weight:600;border-radius:3px;padding:0 4px;background:var(--bg-app);color:var(--text-secondary);align-self:flex-start}
.wb-badge.new{background:var(--pill-green-bg);color:var(--pill-green-fg)}

/* ── Etapas ── */
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.card.pr{display:flex;flex-direction:column;gap:6px}
.card.pr b{font-size:14px;font-weight:600}
.card.pr span:last-child{font-size:13px;color:var(--text-secondary)}
.pr-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--bg-app);border:1px solid var(--border-default);color:var(--text-secondary)}
.dg{position:relative;margin:4px auto 0}
.dg-lanes span{position:absolute;bottom:0;text-align:center;font-size:10.5px;color:var(--text-disabled);text-transform:uppercase;letter-spacing:.06em}
.dg-edges{position:absolute;left:0;top:0;overflow:visible}

.dg-node{position:absolute;display:flex;flex-direction:column;gap:5px;padding:8px 10px;border-radius:9px;border:1px solid var(--border-default);background:var(--bg-app);box-shadow:inset 3px 0 0 var(--wc);text-align:left;cursor:pointer;color:var(--text-primary);transition:var(--tr)}
.dg-node:hover{border-color:var(--border-strong);background:var(--bg-surface-hover)}
.dg-top{display:flex;align-items:center;gap:6px}
.dg-top .sdot{margin-left:auto}
.dg-top b.mono{font-size:12px;font-weight:700;color:var(--text-primary)}
.dg-top .tag{height:18px;font-size:10.5px;padding:0 5px}
.dg-name{font-size:12px;font-weight:500;line-height:1.25;color:var(--text-secondary)}
.waves{display:flex;flex-direction:column;gap:14px;margin-top:6px}
.wave{display:flex;flex-direction:column;gap:8px}
.wave-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.st-card{display:flex;flex-direction:column;gap:7px;padding:12px 14px;border-radius:var(--radius-lg);border:1px solid var(--border-default);background:var(--bg-surface);text-align:left;cursor:pointer;color:var(--text-primary);transition:var(--tr)}
.st-card:hover{border-color:var(--border-strong);background:var(--bg-surface-hover)}
.st-name{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600}
.st-name .i{color:var(--text-muted)}
.st-q{font-size:13px;color:var(--text-secondary)}
.st-meta{font-size:11.5px;color:var(--text-muted);margin-top:auto}
.grow-seg{align-self:flex-start}
.grow{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start}
.grow-side{display:flex;flex-direction:column;gap:10px}
.grow-h{display:flex;flex-direction:column;gap:2px}
.grow-h b{font-size:17px;font-weight:650;letter-spacing:-.01em}
.grow-side p{margin:0;font-size:13.5px}
.grow-n{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:baseline}
.grow-n b{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.grow-n span{font-size:12px;color:var(--text-muted)}
.grow-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.grow-list li{display:flex;align-items:center;gap:7px;font-size:13px}
.grow-list .i{color:var(--accent-green)}
.gm{display:flex;flex-direction:column;min-width:760px}
.gm-row{display:grid;grid-template-columns:200px repeat(var(--n),minmax(34px,1fr));align-items:center;height:24px}
.gm-row>span{font-size:12px;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:10px}
.gm-row>i{height:100%;display:flex;align-items:center;justify-content:center;position:relative;border-left:1px solid var(--border-subtle)}
.gm-row>i.has::after{content:"";position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;background:var(--wc);opacity:.35}
.gm-row>i.new::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--wc)}
.gm-row:nth-child(even){background:var(--bg-app)}
.gm-head{height:30px;background:transparent!important}
.gm-head button{background:none;border:0;color:var(--text-muted);cursor:pointer;font-weight:600;font-size:11.5px;padding:0}
.gm-head button:hover{color:var(--text-primary)}
.crumb-link{background:none;border:0;padding:0;color:var(--text-muted);cursor:pointer;font:inherit}
.crumb-link:hover{color:var(--text-primary)}
.st-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.st-nav{display:flex;gap:6px}
.stage-q{display:flex;gap:14px;margin-top:18px;padding:16px 18px;border:1px solid var(--border-default);border-radius:var(--radius-lg);background:var(--bg-surface);box-shadow:inset 3px 0 0 var(--accent-blue)}
.stage-q p{margin:4px 0 6px;font-size:18px;font-weight:600;letter-spacing:-.01em;text-wrap:balance;max-width:65ch}
.stage-q .sec{font-size:13.5px;display:block;max-width:75ch}
.sq-ic{width:34px;height:34px;flex:none;border-radius:9px;display:grid;place-items:center;background:var(--pill-blue-bg);color:var(--pill-blue-fg)}
.feat-t{display:flex;gap:10px;align-items:flex-start}
.feat-t .i{color:var(--text-muted);margin-top:1px}
.row.feat .meta{padding-left:28px}
.notyet{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px}
.vgrid{align-items:start}
.vq{padding:10px 0;border-top:1px solid var(--border-subtle);display:flex;flex-direction:column;gap:8px}
.vq:first-of-type{border-top:0}
.vq-t{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.vq-a{display:flex;flex-wrap:wrap;gap:5px}
.ans{font-size:11.5px;border:1px dashed var(--border-strong);border-radius:5px;padding:1px 7px;color:var(--text-secondary)}
.logs td.ev{color:var(--pill-blue-fg)}
.card.crit{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.crit-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.crit-list li{display:flex;gap:8px;align-items:flex-start}
.crit-list .i{color:var(--accent-green);margin-top:2px}
.st-foot{display:flex;justify-content:space-between;gap:10px;margin-top:32px;flex-wrap:wrap}

@media (max-width: 1100px){
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grow{grid-template-columns:minmax(0,1fr)}
}
@media (max-width: 900px){
  .grid4,.vgrid{grid-template-columns:minmax(0,1fr)}
  .stage-q p{font-size:16px}
}

.wf-pick{display:flex;align-items:center;gap:5px}
.wf-pick .wf-task{flex:1;min-width:0}
.wb-badge.plus{background:var(--pill-orange-bg);color:var(--pill-orange-fg)}
.wb-badge.minus{background:var(--pill-blue-bg);color:var(--pill-blue-fg)}
.wf-li.diff-plus>.i{color:var(--pill-orange-fg)}
.wf-li.diff-minus>.i{color:var(--pill-blue-fg)}
.wf-card>.pin:first-child{z-index:4}

/* ── Progresso e respostas ── */
.reply{display:flex;gap:10px;margin-top:8px;padding:9px 12px;border-radius:8px;background:var(--pill-purple-bg);border:1px solid var(--pill-purple-bd);color:var(--text-primary);font-size:13px}
.reply>.i{color:var(--pill-purple-fg);flex:none;margin-top:2px}
.reply div{display:flex;flex-direction:column;gap:2px}
.reply b{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--pill-purple-fg)}
.pst{width:7px;height:7px;border-radius:50%;background:var(--pc);flex:none;margin-left:6px}
.pst[data-s="rascunho"]{background:transparent;border:1px solid var(--border-strong)}
.nav-item .pst+.badge{margin-left:6px}
.nav-item .pst{order:3}
.nav-item .badge{order:4}
.pp{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:18px;align-items:center;border:1px solid var(--border-default);border-radius:var(--radius-lg);background:var(--bg-surface);padding:16px 18px}
.pp-now{display:flex;flex-direction:column;gap:8px}
.pp-cur{display:flex;flex-direction:column;align-items:flex-start;gap:6px;background:none;border:0;padding:0;cursor:pointer;color:var(--text-primary);text-align:left}
.pp-cur b{font-size:17px;font-weight:650;letter-spacing:-.01em}
.pp-pipe{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:6px}
.pp-st{display:flex;flex-direction:column;gap:5px;padding:8px 9px;border-radius:8px;border:1px solid var(--border-default);background:var(--bg-app);cursor:pointer;text-align:left;color:var(--text-primary);transition:var(--tr)}
.pp-st:hover{border-color:var(--border-strong)}
.pp-st.cur{border-color:var(--pc);box-shadow:inset 0 0 0 1px var(--pc)}
.pp-st b{font-size:12px}
.pp-st em{font-style:normal;font-size:10.5px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pp-st[data-s="aprovada"] em,.pp-st[data-s="dev"] em,.pp-st[data-s="validacao"] em,.pp-st[data-s="concluida"] em{color:var(--pc)}
.pp-bar{height:4px;border-radius:3px;background:var(--border-subtle);overflow:hidden}
.pp-bar i{display:block;height:100%;background:var(--pc)}
.devlog{display:flex;flex-direction:column;gap:0}
.dl{display:grid;grid-template-columns:86px 52px minmax(0,1fr);gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--border-subtle);font-size:13px}
.dl:first-of-type{border-top:0}
.pstep{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px;padding:10px 14px;border:1px solid var(--border-default);border-radius:var(--radius-lg);background:var(--bg-surface)}
.ps{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-muted)}
.ps i{width:16px;height:16px;border-radius:50%;border:1px solid var(--border-strong);display:grid;place-items:center;flex:none}
.ps i .i{width:10px;height:10px}
.ps.done{color:var(--text-secondary)}
.ps.done i{background:var(--pill-green-bg);border-color:var(--pill-green-bd);color:var(--pill-green-fg)}
.ps.on{color:var(--text-primary);font-weight:600}
.ps.on i{background:var(--pc);border-color:var(--pc);box-shadow:0 0 0 3px var(--bg-surface-active)}
.ps em{font-style:normal;font-size:11px;color:var(--text-muted);font-weight:400}
.ps-line{flex:0 1 24px;height:1px;background:var(--border-strong)}
.ps-count{margin-left:auto;font-size:12px;color:var(--text-muted);font-variant-numeric:tabular-nums}
.rv-wrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.tag.dev .i{width:12px;height:12px}
@media (max-width: 900px){ .pp{grid-template-columns:minmax(0,1fr)} .dl{grid-template-columns:78px minmax(0,1fr)} .dl>:nth-child(2){display:none} }

</style>

<script>
/* DailyFlow — wireframes de revisão.
 * Interpretação visual do que será desenvolvido; não é o layout final.
 * Tudo usa os tokens do design system, então acompanha o tema claro/escuro.
 */
function makeWireframes({ icon, esc, iconSrc }) {
  const pad = n => String(n).padStart(2, '0');
  const fmt = h => { const hh = Math.floor(h), mm = Math.round((h - hh) * 60); return `${pad(hh % 24)}:${pad(mm)}`; };
  const pin = n => `<b class="pin">${n}</b>`;
  const I = (n, c = 'xs') => icon(n, c);

  /* ── Peças ── */
  const NAV = [['hoje', 'home', 'Hoje'], ['tarefas', 'tasks', 'Tarefas', '3'], ['historico', 'history', 'Histórico'], ['insights', 'chart', 'Insights'], ['config', 'gear', 'Configurações']];
  let NAVSET = null;
  const side = active => `<div class="wf-side"><div class="b"><img src="${iconSrc}" alt="">DailyFlow</div>${NAV.filter(n => !NAVSET || NAVSET.includes(n[0])).map(([k, ic, l, n]) => `<div class="wf-nav${k === active ? ' on' : ''}">${I(ic, 'sm')}<span>${l}</span>${n ? `<em>${n}</em>` : ''}</div>`).join('')}<div class="wf-side-foot">${I('refresh')}<span>Sincronizado</span></div></div>`;
  const win = (main, { active = 'hoje', title = 'DailyFlow', noside = false, overlay = '' } = {}) =>

/* ── Persistência: localStorage + db do artifact quando disponível ── */
let DB = null, DL = null;
const timers = new Map(), chains = new Map();
function setR(id, patch) {
  S.reviews[id] = Object.assign({}, getR(id), patch, { updatedAt: new Date().toISOString() });
  lsSet(LS, S.reviews);
  queueRemote(id);
  refreshCounters();
}
function queueRemote(id, delay = 700) {
  if (!DB) return;
  clearTimeout(timers.get(id));
  timers.set(id, setTimeout(() => flush(id), delay));
}
function flush(id) {
  timers.delete(id);
  const prev = chains.get(id) || Promise.resolve();
  const next = prev.then(async () => {
    const r = S.reviews[id]; if (!r) return;
    try {
      await DB.doc('reviews/' + id).set({ status: r.status || '', comment: r.comment || '', updatedAt: r.updatedAt || '' });
      setSync('cloud');
    } catch (e) { setSync('error'); }
  });
  chains.set(id, next);
}
function setSync(s) {
  const el = $('#sync'); if (!el) return;
  el.dataset.s = s;
  $('#syncTxt').textContent = { cloud: 'Salvo no artifact (sincroniza)', local: 'Salvo neste navegador', error: 'Erro ao salvar na nuvem · cópia local ok', wait: 'Conectando…' }[s];
}
async function initCloud() {
  if (!window.claude || typeof window.claude.use !== 'function') { setSync('local'); return; }
  setSync('wait');
  try { DL = await window.claude.use('downloads'); } catch { DL = null; }
  let db = null;
  try { db = await window.claude.use('db'); } catch { db = null; }
  if (!db) { setSync('local'); return; }
  DB = db;
  let first = true;
  db.collection('reviews').onSnapshot(snap => {
    const remote = {};
    snap.docs.forEach(d => { remote[d.id] = d.data(); });
    if (first) {
      first = false;
      for (const [id, r] of Object.entries(S.reviews)) {
        const rr = remote[id];
        if (!rr || (r.updatedAt || '') > (rr.updatedAt || '')) queueRemote(id, 300);
      }
    }
    let changed = false;
    for (const [id, rr] of Object.entries(remote)) {
      const lr = S.reviews[id];
      if (!lr || (rr.updatedAt || '') > (lr.updatedAt || '')) {
        S.reviews[id] = { status: rr.status || '', comment: rr.comment || '', updatedAt: rr.updatedAt || '' };
        patchItem(id); changed = true;
      }
    }
    if (changed) { lsSet(LS, S.reviews); refreshCounters(); }
    setSync('cloud');
  }, () => setSync('error'));
  db.collection('progress').onSnapshot(snap => {
    PROG.stages = {}; snap.docs.forEach(d => { PROG.stages[d.id] = d.data(); }); PROG.live = true; onProgress();
  }, () => {});
  db.collection('devlog').onSnapshot(snap => {
    PROG.log = snap.docs.map(d => Object.assign({ id: d.id }, d.data())).sort((a, b) => String(b.ts).localeCompare(String(a.ts))); onProgress();
  }, () => {});
}

  return `<button type="button" class="cbtn${has ? ' has' : ''}" data-toggle="${esc(id)}" title="Comentar" aria-expanded="${has}">${icon('msg')}${label ? `<span>${has ? 'Comentário' : 'Comentar'}</span>` : ''}</button>`;
}
function cbox(id, ph = 'Comentário…', force = false) {
  const has = !!(getR(id).comment || '').trim();
  const rep = (C.replies || {})[id];
  const reply = rep ? `<div class="reply">${icon('msg', 'sm')}<div><b>Resposta</b><span>${esc(rep)}</span></div></div>` : '';
  return `${reply}<div class="cwrap" data-for="${esc(id)}"${force || has || rep ? '' : ' hidden'}>${ta(id, rep ? 'Responder…' : ph)}</div>`;
}
const rvBar = (id, opts = {}) => `<div class="rv" data-rv="${esc(id)}">${chips(id, opts)}${opts.inline ? '' : cbtn(id)}</div>`;
const sdot = id => { const r = getR(id); return `<span class="sdot" data-sdot="${esc(id)}" data-s="${r.status || ''}" data-c="${(r.comment || '').trim() ? 1 : 0}" title="${esc(r.status ? stLabel(r.status, id) : 'Sem status')}"></span>`; };

const SRC = { spec: ['Spec', 'gray'], derivada: ['Derivada', 'cyan'], nova: ['Nova', 'purple'] };
const srcTag = s => `<span class="tag ${SRC[s][1]}" title="${{ spec: 'Está na spec', derivada: 'Implícita na spec, sem história ou fluxo explícito', nova: 'Proposta nova, não está na spec' }[s]}">${SRC[s][0]}</span>`;
const PHASE_C = p => /MVP/.test(p) ? 'green' : /Proposta/.test(p) ? 'purple' : /definir/.test(p) ? 'yellow' : 'gray';
const phaseTag = p => `<span class="tag ${PHASE_C(p)}">${esc(p)}</span>`;
const WHEN = { manha: 'Manhã', dia: 'Durante o dia', noite: 'Noite', qualquer: 'Qualquer hora', config: 'Configuração', futuro: 'Futuro' };
const STATE = { nao: 'Não planejado', plan: 'Planejando', ativo: 'Ativo', fech: 'Fechando', fechado: 'Fechado' };
const STATE_C = { nao: 'gray', plan: 'purple', ativo: 'blue', fech: 'orange', fechado: 'green' };
const link = id => `<button type="button" class="tag link" data-go="${esc(id)}">${esc(id)}</button>`;

function header(k, title, lead, extra = '') {
  const s = SEC[k];
  return `<nav class="crumbs" aria-label="Caminho">${icon('home', 'sm')}<span>›</span><span>DailyFlow</span><span>›</span><b>${esc(s ? s.label : title)}</b></nav>
  <h1>${esc(title)}</h1>${lead ? `<p class="lead">${lead}</p>` : ''}${extra}`;
}
const secComment = k => `<section class="section" style="margin-top:40px"><div class="section-head"><h2>Comentário geral</h2><span class="muted">Algo que falta, sobra ou está errado nesta seção</span></div>${ta('sec.' + k, 'Escreva livremente…')}</section>`;
const seg = (key, opts) => `<div class="seg" role="group">${opts.map(([v, l, n]) => `<button type="button" data-f="${key}" data-v="${v}" aria-pressed="${S.f[key] === v}">${esc(l)}${n != null ? ` <span class="n">${n}</span>` : ''}</button>`).join('')}</div>`;

/* ── Timeline mini (Baseline / Final / Real e mock do Hoje) ── */
const T = (h, m = 0) => h + m / 60;
const DAY = {
  base: [[6, 9, 'Maker', 'orange'], [9, 10, 'Drive / Felipe', 'cyan'], [10, 11, 'Work', 'blue'], [11, 12, 'Music', 'purple'], [12, 14, 'Lunch + FlightSim', 'yellow'], [14, 17.5, 'Work', 'blue'], [17.5, 18.5, 'Drive / Felipe', 'cyan'], [18.5, 21, 'Family', 'green'], [21, 22, 'Reading', 'pink']],
  final: [[6, 9, 'Maker', 'orange'], [9, 10, 'Drive / Felipe', 'cyan'], [10, 11, 'Work', 'blue'], [11.5, 12, 'Meeting', 'gray'], [12, 13, 'Lunch', 'yellow'], [13, 14, 'Music', 'purple'], [14, 18, 'Work', 'blue'], [18, 19, 'Drive / Felipe', 'cyan'], [19, 21, 'Family', 'green'], [21, 22, 'Reading', 'pink']],
  real: [[T(6, 20), T(8, 50), 'Maker', 'orange'], [T(8, 50), T(10, 5), 'Commute', 'cyan'], [T(10, 5), T(11, 28), 'Work', 'blue'], [11.5, 12, 'Meeting', 'gray'], [12, T(13, 5), 'Lunch', 'yellow'], [T(13, 8), T(13, 52), 'Music', 'purple'], [T(14, 5), T(18, 10), 'Work', 'blue'], [T(18, 10), T(19, 5), 'Drive', 'cyan'], [T(19, 5), T(21, 20), 'Family', 'green'], [T(21, 20), 22, 'Reading', 'pink']],
};
const fmt = h => { const hh = Math.floor(h), mm = Math.round((h - hh) * 60); return `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`; };
function miniTl(blocks, { pph = 22, from = 6, to = 22, ghost = false, now = null, labels = false, times = false } = {}) {
  const H = (to - from) * pph;
  let hrs = '';
  for (let h = from; h <= to; h += 2) hrs += `<div class="hr" style="top:${(h - from) * pph}px">${labels ? `<span>${String(h).padStart(2, '0')}</span>` : ''}</div>`;
  const bl = blocks.map(([a, b, n, c]) => {
    const top = (a - from) * pph + 1, h = Math.max((b - a) * pph - 2, 10);
    const past = now != null && b <= now;
    return `<div class="blk c-${c}${ghost ? ' ghost' : ''}" style="top:${top}px;height:${h}px;${labels ? 'left:30px;' : ''}${past ? 'opacity:.55;' : ''}" title="${fmt(a)}–${fmt(b)} ${esc(n)}"><span>${esc(n)}</span>${times && h > 16 ? `<small>${fmt(a)}</small>` : ''}</div>`;
  }).join('');
  const nl = now != null ? `<div class="nowline" style="top:${(now - from) * pph}px"><span>${fmt(now)}</span></div>` : '';
  return `<div class="tl" style="height:${H}px">${hrs}${bl}${nl}</div>`;
}
function axis(pph = 22, from = 6, to = 22) {
  let s = ''; for (let h = from; h <= to; h += 2) s += `<span style="top:${(h - from) * pph}px">${String(h).padStart(2, '0')}:00</span>`;
  return `<div class="axis" style="height:${(to - from) * pph}px">${s}</div>`;
}

/* ── Páginas ── */

  <section class="section"><div class="section-head"><h2>Progresso</h2><span class="muted">itens com status ou comentário</span></div><div class="list">${rows}</div></section>

  <section class="section" data-item="VIS-TESE">

    <ol class="questions6"><li>O que foi planejado?</li><li>O que está acontecendo agora?</li><li>O que vem a seguir?</li><li>O que ainda precisa caber hoje?</li><li>O que mudou?</li><li>Como o tempo foi realmente gasto?</li></ol>

      ${layer('Baseline', 'O plano aceito no INICIAR DIA. Imutável.', DAY.base, true, 'var(--text-muted)')}

    ${wfFigure('dayDiff')}
    ${rvBar('VIS-CAMADAS')}${cbox('VIS-CAMADAS')}
